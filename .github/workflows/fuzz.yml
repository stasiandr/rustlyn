name: Fuzz

# What an editor asks of Rustlyn, over real C# broken the ways typing breaks
# it (crates/rustlyn-ide/examples/fuzz.rs). Too long for every push; nightly,
# and by hand. A run that keeps a finding fails and uploads it: replay one
# with `cargo run --release -p rustlyn-ide --example fuzz -- --replay <dir>`.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes each mode runs
        default: "20"

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Without a compilation (parsing, colouring, formatting, …) and over
        # a compiled project (diagnostics, completion, rename, …).
        mode: [syntax, semantic]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The seeds: some of Roslyn's own sources, real C# of every shape.
      - uses: actions/checkout@v4
        with:
          repository: dotnet/roslyn
          path: corpus
          sparse-checkout: |
            src/Compilers/CSharp/Portable/Binder
            src/Compilers/Core/Portable/Collections
            src/Workspaces/SharedUtilitiesAndExtensions/Compiler/Core
      - run: cargo build --release -p rustlyn-ide --example fuzz
      - name: Fuzz
        run: |
          target/release/examples/fuzz --corpus corpus/src --out fuzz-out \
            --jobs 4 --minutes "${{ inputs.minutes || '20' }}" \
            ${{ matrix.mode == 'semantic' && '--semantic' || '' }}
      - name: Findings
        run: |
          if [ -n "$(ls -A fuzz-out/findings 2>/dev/null)" ]; then
            for finding in fuzz-out/findings/*; do
              echo "::error::$(basename "$finding"): $(head -2 "$finding/report.txt" 2>/dev/null | tr "\n" " ")"
            done
            exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: findings-${{ matrix.mode }}
          path: fuzz-out/findings
